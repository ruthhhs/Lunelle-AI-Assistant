<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunelle AI Assistant</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Huninn&family=Quicksand:wght@300..700&display=swap" rel="stylesheet" />
</head>
<body>

    <main class="phone chat-container">

        <header class="chat-header">
            <button id="back-btn" onclick="location.href='index.html'">
                <
            </button>

            Lunelle AI Assistant
        </header>

        <div id="chat-box" class="chat-box">

            <div class="message bot-message">Halo! Saya asisten Lunelle. Ada yang bisa saya bantu?</div>

        </div>

        <div class="input-area">
            <input
                type="text"
                id="user-input"
                placeholder="Ketik pesan..."
            >

            <button id="send-btn" onclick="window.sendMessage()">
                Kirim
            </button>
        </div>

    </main>

<script src="js/context.js"></script>
<script src="js/handlers.js"></script>
<script src="js/chatbot.js"></script>

</body>
</html>
